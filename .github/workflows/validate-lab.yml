name: Validate lab documentation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and project documentation
        run: python3 docs/validate_catalog.py
