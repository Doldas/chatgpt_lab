name: Multidimension Life tests

on:
  pull_request:
    paths:
      - "multidimension-life/**"
      - ".github/workflows/multidimension-life.yml"
  push:
    branches:
      - master
    paths:
      - "multidimension-life/**"
      - ".github/workflows/multidimension-life.yml"

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dimensional automata tests
        run: node multidimension-life/engine.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check multidimension-life/engine.mjs
          node --check multidimension-life/app.js
