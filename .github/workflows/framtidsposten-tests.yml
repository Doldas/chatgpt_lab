name: Framtidsposten tests

on:
  pull_request:
    paths:
      - 'framtidsposten/**'
      - '.github/workflows/framtidsposten-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s framtidsposten -p 'test_*.py' -v
      - name: Smoke test
        run: python3 framtidsposten/stamps.py "ett brev till igår" --antal 2
